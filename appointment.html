<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Appointment - Sakthi Dental Clinic</title>
<link rel="stylesheet" href="style.css">
<style>
/* Appointment Form */
.appointment-section {
    max-width: 500px;
    margin: 3rem auto;
    background: #fff;
    padding: 2rem;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.05);
}
.appointment-section h1 {
    text-align: center;
    color: #0066cc;
    margin-bottom: 1.5rem;
}
.appointment-section input,
.appointment-section button {
    width: 100%;
    padding: 0.8rem;
    margin-bottom: 1rem;
    border-radius: 6px;
    border: 1px solid #ccc;
}
.appointment-section button {
    background: #0066cc;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 1rem;
}
.appointment-section button:hover {
    background: #004b99;
}

/* Confirmation Success Card */
.confirmation {
    display: none;
    background: white;
    padding: 2rem;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 6px 30px rgba(0,0,0,0.1);
    animation: fadeInScale 0.6s ease forwards;
}
.confirmation h2 {
    color: #28a745;
    font-size: 1.8rem;
    margin-bottom: 1rem;
}
.confirmation p {
    font-size: 1rem;
    color: #333;
}

/* Animated Checkmark */
.checkmark {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    display: inline-block;
    border: 4px solid #28a745;
    position: relative;
    animation: popIn 0.5s ease;
}
.checkmark::after {
    content: "";
    position: absolute;
    left: 22px;
    top: 15px;
    width: 20px;
    height: 40px;
    border-right: 4px solid #28a745;
    border-bottom: 4px solid #28a745;
    transform: rotate(45deg);
    animation: drawCheck 0.6s ease forwards;
}

/* Error Card */
.error-card {
    display: none;
    background: #ff4d4d;
    color: white;
    padding: 1rem;
    border-radius: 8px;
    text-align: center;
    margin-bottom: 1rem;
    font-weight: bold;
    animation: slideDown 0.5s ease forwards;
}
@keyframes slideDown {
    0% { opacity: 0; transform: translateY(-20px); }
    100% { opacity: 1; transform: translateY(0); }
}

/* Animations */
@keyframes fadeInScale {
    0% { opacity: 0; transform: scale(0.8); }
    100% { opacity: 1; transform: scale(1); }
}
@keyframes popIn {
    0% { transform: scale(0); }
    100% { transform: scale(1); }
}
@keyframes drawCheck {
    0% { height: 0; width: 0; }
    100% { height: 40px; width: 20px; }
}
</style>
</head>
<body>

<!-- ===== Navigation ===== -->
<nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About Us</a></li>
        <li><a href="treatment.html">Treatments</a></li>
        <li><a href="services.html">Services & Prices</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="policy.html">Privacy Policy</a></li>
    </ul>
</nav>

<!-- ===== Appointment Form ===== -->
<section class="appointment-section">
    <h1>Fix an Appointment</h1>

    <!-- Error Message -->
    <div class="error-card" id="errorBox"></div>

    <input type="text" id="name" placeholder="Your Name" required>
    <input type="tel" id="phone" placeholder="Phone Number" required>
    <input type="email" id="email" placeholder="Email Address" required>
    <label for="date">Preferred Date:</label>
    <input type="date" id="date" required>
    <label for="time">Preferred Time:</label>
    <input type="time" id="time" required>
    <button onclick="fixAppointment()">Fix Appointment</button>

    <div class="confirmation" id="confirmationBox">
        <div class="checkmark"></div>
        <h2>Appointment Confirmed!</h2>
        <p>Thank you, <span id="patientName"></span>.</p>
        <p>Your appointment is fixed for:</p>
        <p><strong>Date:</strong> <span id="apptDate"></span></p>
        <p><strong>Time:</strong> <span id="apptTime"></span></p>
    </div>
</section>

<script>
function showError(message) {
    let errorBox = document.getElementById("errorBox");
    errorBox.innerText = message;
    errorBox.style.display = "block";

    // Hide error after 4 seconds
    setTimeout(() => {
        errorBox.style.display = "none";
    }, 4000);
}

function fixAppointment() {
    let name = document.getElementById("name").value.trim();
    let date = document.getElementById("date").value;
    let time = document.getElementById("time").value;

    if (!name || !date || !time) {
        showError("Please fill in all required fields!");
        return;
    }

    // Convert date string to Date object
    let selectedDate = new Date(date);
    let dayOfWeek = selectedDate.getDay(); // 0 = Sunday, 6 = Saturday

    // Check if Sunday
    if (dayOfWeek === 0) {
        showError("Sunday is a holiday. Please choose another date.");
        return;
    }

    // Check time between 09:00 and 20:00
    let [hour, minute] = time.split(":").map(Number);
    if (hour < 9 || (hour === 20 && minute > 0) || hour > 20) {
        showError("Shop closed during this period. Please select a time between 9:00 AM and 8:00 PM.");
        return;
    }

    // If everything is valid, show confirmation
    document.getElementById("patientName").innerText = name;
    document.getElementById("apptDate").innerText = date;
    document.getElementById("apptTime").innerText = time;
    document.getElementById("confirmationBox").style.display = "block";
}
</script>

</body>
</html>
